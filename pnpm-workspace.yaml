packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': false
  '@prisma/engines': false
  '@swc/core': true
  canvas: false
  es5-ext: true
  esbuild: true
  prisma: false
  sharp: true
  unrs-resolver: true
  x-data-spreadsheet: true

# canvas is only used by pdfjs-dist for server-side rendering; this project
# renders PDFs in the browser, so we skip its native build entirely.
ignoredOptionalDependencies:
  - canvas
