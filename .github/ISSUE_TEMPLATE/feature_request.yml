name: Feature request
description: Suggest an integration, renderer, or developer-experience improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user or integration problem rather than only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New or existing preview format
        - Public React API
        - Performance and large files
        - Security and sandboxing
        - Accessibility or i18n
        - Documentation and examples
        - Build, packaging, or browser compatibility
    validations:
      required: true
