name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Verify Git LFS demo assets
        shell: bash
        run: |
          git lfs pull

          pointer_files="$(
            grep -RIl \
              '^version https://git-lfs.github.com/spec/v1$' \
              apps/playground/public/demo \
              || true
          )"

          if [ -n "$pointer_files" ]; then
            echo "::error::The following demo assets are still Git LFS pointer files:"
            echo "$pointer_files"
            exit 1
          fi

          echo "All Git LFS demo assets were downloaded successfully."

      - name: Verify Office demo archives
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from zipfile import BadZipFile, ZipFile

          demo_dir = Path("apps/playground/public/demo")
          zip_extensions = {".xlsx", ".docx", ".pptx", ".epub"}

          failed = []

          for path in demo_dir.iterdir():
              if not path.is_file() or path.suffix.lower() not in zip_extensions:
                  continue

              try:
                  with ZipFile(path) as archive:
                      bad_member = archive.testzip()
                      if bad_member:
                          failed.append(f"{path}: corrupt member {bad_member}")
              except BadZipFile:
                  failed.append(f"{path}: not a valid ZIP/OOXML package")

          if failed:
              print("Invalid Office demo files:")
              for item in failed:
                  print(f"  - {item}")
              raise SystemExit(1)

          print("All Office demo archives are valid.")
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test

      # build:pages forces NEXT_PUBLIC_DEPLOY_TARGET=github-pages, which flips
      # next.config.ts into `output: "export"` mode. The library must be built
      # first so its dist/ types are available to the playground build.
      - name: Build GitHub Pages static export
        run: |
          pnpm run build:lib
          pnpm --filter @lamberl-lee/playground run build:pages

      # Output directory moved with the pnpm monorepo split — playground's
      # `next export` now writes to apps/playground/out/.
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./apps/playground/out

  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
