name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test, and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Read pnpm version from root package.json's "packageManager" field
      # so CI never drifts from local — the source of truth is the package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Print tool versions
        run: |
          node --version
          pnpm --version

      # `pnpm install` honors the workspace + the .npmrc registry; --frozen-lockfile
      # asserts pnpm-lock.yaml is up-to-date with all three package.json files.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      # `pnpm run typecheck` at the root builds the library first
      # (apps/playground reads its types from packages/file-preview/dist/),
      # then runs tsc in both workspace projects.
      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      # `build` builds the library, then the playground production bundle.
      - name: Build all packages
        run: pnpm run build
