name: Release

# Changesets release flow.
#
# Two trigger paths:
#
# 1. push to main with a pending .changeset/*.md → opens/updates a
#    "Version Packages" PR that bumps versions + regenerates CHANGELOG.md.
#    Maintainer merges that PR when ready to release.
# 2. push to main where package.json versions actually changed (i.e. the
#    Version Packages PR was merged) → publishes to npm.
#
# NPM_AUTH_TOKEN must be configured as a repository secret. Get one from
# npmjs.com → Access Tokens → "Automation" (granular, publish-only).

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write # for npm provenance (OIDC)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # changesets needs full history to diff against the previous
          # release tag when computing the changelog.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Print tool versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the library so changesets publishes a dist/ that's actually
      # populated — without this the published tarball would be source-only.
      - name: Build packages
        run: pnpm run build:lib

      - name: Create or update Version Packages PR
        id: changeset
        uses: changesets/action@v1
        with:
          # `version` runs changeset version + commits the bumps + opens the PR.
          # `publish` runs changeset publish when there are no pending changesets
          # but the version fields have advanced — i.e. the PR was just merged.
          version: pnpm run version
          publish: pnpm run release
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
